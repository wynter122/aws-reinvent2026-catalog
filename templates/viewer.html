    --on-accent: #06272A; --star: #F0B040; --warn: #FF8A80; --warn-soft: #3A1D1B;
  --v0: #1D2B2F; --v1: #1C4542; --v2: #4A3A14; --v3: #352C57; --v4: #4F2630; --v5: #1F3A58;

  }
}
:root[data-theme="dark"] {
  --bg: #0D1416; --surface: #152023; --surface-2: #1D2B2F; --line: #2B3D42;
  --fg: #E1ECEC; --muted: #92A7AA; --accent: #5CC4CC; --accent-soft: #163A3E;

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {

  background: var(--bg);
  color: var(--fg);
  font: 400 0.9375rem/1.55 var(--font-body);

}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

.wrap { max-width: 86rem; margin: 0 auto; padding-inline: 1rem; }

.bar {

  background: var(--bg); border-bottom: 1px solid var(--line);
}

.tabs { display: flex; gap: 0.25rem; }
.tab {

  padding: 0.375rem 0.75rem; font-weight: 500; color: var(--muted);
}
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); }

/* 본문 2단 */
.cols { display: grid; grid-template-columns: 17.5rem minmax(0, 1fr); gap: 1.75rem; padding-block: 1rem 4rem; align-items: start; }
.rail {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h));
  max-height: var(--rail-h, calc(100vh - var(--bar-h) - 1rem)); overflow-y: auto;
  padding-right: 0.5rem; display: flex; flex-direction: column; gap: 0.25rem;
}
.toggles { display: flex; flex-direction: column; gap: 0.25rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--line); }
.toggles label, .opts label { display: flex; gap: 0.5rem; align-items: baseline; cursor: pointer; padding-block: 0.125rem; }

.facet { border-bottom: 1px solid var(--line); }

.opts:has(+ .facet-more:not([hidden])) { padding-bottom: 0.25rem; }

}
.facet-more:hover, .facet-info:hover { text-decoration: underline; }

.opt-d { display: none; margin-top: 0.0625rem; font-size: 0.75rem; line-height: 1.45; color: var(--muted); word-break: keep-all; overflow-wrap: anywhere; }

.main { min-width: 0; display: flex; flex-direction: column; gap: 0.75rem; }
.status { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; justify-content: space-between; }
.count { margin: 0; color: var(--muted); }
.count b { color: var(--fg); font: 500 1rem var(--font-data); }
.picked { display: flex; flex-wrap: wrap; gap: 0.375rem; }
.pick {

  border-radius: 1rem; padding: 0.0625rem 0.625rem; font-size: 0.8125rem;
}
.pick::after { content: " ×"; color: var(--muted); }
.pick.clear { border-color: var(--line); background: none; color: var(--muted); }
.pick.clear::after { content: ""; }

.list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row {
  display: grid; grid-template-columns: 6.75rem minmax(0, 1fr) auto; gap: 0.25rem 1rem;
  padding-block: 0.875rem; border-bottom: 1px solid var(--line);
}
.row.open { background: var(--surface); margin-inline: -0.75rem; padding-inline: 0.75rem; }
.r-time { display: flex; flex-direction: column; font: 400 0.8125rem/1.45 var(--font-data); font-variant-numeric: tabular-nums; }

.lv1 { background: var(--lv1); } .lv2 { background: var(--lv2); } .lv3 { background: var(--lv3); }

.abs { display: flex; flex-direction: column; gap: 0.25rem; align-items: flex-start; }

.dl { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: 0.375rem 0.75rem; margin: 0; font-size: 0.875rem; }
.dl dt { color: var(--muted); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.04em; padding-top: 0.125rem; }
.dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.dl .who { display: block; }

.slots { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.25rem; }
.slots li { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

.more { align-self: center; margin-top: 0.5rem; }
.empty { padding: 3rem 1rem; text-align: center; color: var(--muted); border-bottom: 1px solid var(--line); }

.day-h {
  display: flex; gap: 0.75rem; align-items: baseline; margin: 1.25rem 0 0;
  padding-bottom: 0.5rem; border-bottom: 2px solid var(--fg);
}
.day-h:first-child { margin-top: 0; }

.seg { display: flex; border: 1px solid var(--line); border-radius: 0.375rem; overflow: hidden; }

.menu { position: relative; }
.menu summary { list-style: none; cursor: pointer; user-select: none; }
.menu summary::-webkit-details-marker { display: none; }
.menu[open] summary { border-color: var(--accent); }
.menu-list {
  position: absolute; right: 0; top: calc(100% + 0.25rem); z-index: 4; min-width: 13rem;
  display: flex; flex-direction: column; padding: 0.25rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: 0.375rem;
  box-shadow: 0 0.5rem 1.5rem rgb(0 0 0 / 0.18);
}
.menu-h { margin: 0; padding: 0.375rem 0.625rem; font-size: 0.75rem; color: var(--muted); border-bottom: 1px solid var(--line); }
.menu-list button {

.menu-list button:hover { background: var(--surface-2); }
.menu-list button span { font: 400 0.75rem var(--font-data); color: var(--muted); }
.menu-note { margin: 0; font-size: 0.8125rem; color: var(--muted); }
.menu-note.bad { color: var(--warn); }

.tt-ev:hover, .tt-ev.on { border-color: var(--fg); z-index: 1; }

.tt-ev.short .tt-title, .tt-ev.short .tt-room { display: none; }
.tt-code { font: 500 0.75rem var(--font-data); }
.tt-time { font: 400 0.6875rem var(--font-data); color: var(--muted); }
.tt-title { font-weight: 600; font-size: 0.8125rem; overflow-wrap: anywhere; }

.v0 { background: var(--v0); } .v1 { background: var(--v1); } .v2 { background: var(--v2); }
.v3 { background: var(--v3); } .v4 { background: var(--v4); } .v5 { background: var(--v5); }

</div>

  개인용 비공식 뷰어입니다. 일정과 장소는 바뀔 수 있으니 등록 전에 공식 카탈로그에서 확인하세요. <span id="ko-note" hidden>제목과 설명의 한국어는 Claude가 번역한 것이라 틀릴 수 있습니다.</span> <span id="sync-note">즐겨찾기는 이 브라우저에만 저장됩니다.</span>
</footer>

<script id="catalog-data" type="application/json">__CATALOG_DATA__</script>
<script>
(function () {
  'use strict';
  const DATA = JSON.parse(document.getElementById('catalog-data').textContent);
  const S = DATA.sessions;
  const PAGE = 60;
  const TIGHT_GAP_MIN = 30; // 건물 간 이동에 이보다 여유가 적으면 경고
  const HOUR_PX = 76; // 시간표에서 1시간의 높이
  const SHORT_MIN = 40; // 이보다 짧은 세션은 시간표 블록에 코드와 시간만 표시
  const FACET_LIMIT = 8; // 항목이 많은 필터는 이만큼만 보이고 나머지는 "더 보기"로 펼친다
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];
  const LEVELS = { '100': '100 · 기초', '200': '200 · 중급', '300': '300 · 고급', '400': '400 · 전문가', '500': '500 · 최상급' };
  // 세션 유형: [진행 형태, 일반 시간, 일정을 고를 때의 의미]
  const TYPE_INFO = {
    'Chalk talk': ['AWS 전문가의 짧은 설명 후 참석자 질의·토론', '60분', '토론 비중이 높고 참석자의 질문에 따라 내용이 달라짐'],
    'Breakout session': ['한 명 이상의 발표자가 진행하는 강연', '60분', '많은 내용을 안정적으로 듣기 좋음'],
    'Workshop': ['짧은 설명 후 AWS 환경에서 직접 솔루션 구축', '120분', '노트북 필수, 연속 2시간 확보 필요'],
    "Builders' session": ['소규모 그룹에서 데모 후 전문가와 직접 구현', '60분', '밀도 높은 실습과 질문에 적합, 노트북 필수'],
    'Lightning talk': ['한 주제를 압축한 짧은 발표·사례·데모', '20분', '빈 시간에 넣기 좋고 빠른 탐색에 적합'],
    'Code talk': ['코드와 라이브 코딩 중심의 대화형 설명', '60분', '구현 내용을 따라가며 질문하는 형식'],
    'Gamified learning': ['AWS 문제를 게임·경쟁 방식으로 해결', '90~180분', '실습형이며 노트북 필수'],
    'Lab': ['주어진 시나리오를 자신의 속도로 실습', '시간 가변', '강의보다 개별 수행 중심, 일부는 노트북 필요'],
    'Bootcamp': ['강사가 진행하는 장시간 집중 교육', '240~480분', '반일~종일 일정, 노트북 필수'],
    'Exam prep': ['AWS 자격증 문제 풀이와 전문가 해설', '90~120분', '자격증 준비 목적, 노트북 필수']
  };
  const FORMAT_INFO = {
    'Discussion': '발표자 일방 전달보다 참석자 질문·토론이 포함됨',
    'Lecture-style': '발표자가 내용을 설명하는 강연 중심',
    'Hands-on': '참석자가 직접 코드 작성·구성·실습 수행',
    'AWS Partners': 'AWS 파트너가 제공하거나 후원하는 세션',
    'Customer story': '고객의 실제 도입 사례와 경험 중심',
    'Community-led': 'AWS 직원 중심이 아니라 커뮤니티 발표자가 주도',
    'Self-paced': '강사의 공통 진도보다 참가자가 자신의 속도로 수행'
  };
  const typeKey = v => String(v || '').replace(/\u2019/g, "'");
  const typeInfo = v => TYPE_INFO[typeKey(v)] || null;
  const TOD = ['오전 (12시 이전)', '오후 (12~17시)', '저녁 (17시 이후)'];
  const NONE = '미정';
  const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 17l-5.4 3 1.1-6.1-4.5-4.3 6.1-.8z"/></svg>';

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 불가 환경에서는 무시 */ } }
  };

  function dayLabel(d) {
    if (!d) return '일정 미정';
    const dt = new Date(d + 'T00:00:00Z');
    return DOW[dt.getUTCDay()] + ' ' + (dt.getUTCMonth() + 1) + '/' + dt.getUTCDate();
  }
  function timeOfDay(s) {
    if (s.sm == null) return NONE;
    return s.sm < 720 ? TOD[0] : s.sm < 1020 ? TOD[1] : TOD[2];
  }
  const timeKey = s => (s.d || '9999') + ' ' + (s.s || '99:99') + ' ' + s.c;
  // 번역이 있고 한국어 보기가 켜져 있으면 한국어 제목을 앞세운다
  const koOn = s => state.opts.ko && !!s.tk;
  const titleOf = s => koOn(s) ? s.tk : s.t;

  const FACETS = [
    { k: 'd', label: '요일', get: s => [s.d || NONE], fmt: v => v === NONE ? '일정 미정' : dayLabel(v), order: 'key', open: true },
    { k: 'tod', label: '시간대', get: s => [timeOfDay(s)], order: [...TOD, NONE] },
    { k: 'y', label: '세션 유형', get: s => [s.y], open: true,
      info: v => { const i = typeInfo(v); return i ? '<b>' + esc(i[1]) + '</b> · ' + esc(i[0]) + '<br>' + esc(i[2]) : ''; } },
    { k: 'l', label: '레벨', get: s => [s.l || NONE], fmt: v => LEVELS[v] || '레벨 없음', order: 'key', open: true },
    { k: 'tp', label: '토픽', get: s => s.tp || [] },
    { k: 'v', label: '장소', get: s => [s.v || NONE] },
    { k: 'ai', label: '관심 분야', get: s => s.ai || [] },
    { k: 'sv', label: 'AWS 서비스', get: s => s.sv || [] },
    { k: 'ro', label: '대상 직무', get: s => s.ro || [] },
    { k: 'in', label: '산업', get: s => s.in || [] },
    { k: 'ft', label: '진행 방식', get: s => s.ft || [], info: v => esc(FORMAT_INFO[v] || '') },
    { k: 'tr', label: '트랙 코드', get: s => [s.tr], order: 'key' }
  ];

  // 세션별 검색 문자열과 필터 값 미리 계산
  const byCode = new Map();
  const groups = new Map();
  for (const s of S) {
    byCode.set(s.c, s);
    if (!groups.has(s.g)) groups.set(s.g, []);
    groups.get(s.g).push(s);
    s._f = {};
    for (const f of FACETS) s._f[f.k] = f.get(s);
    s._h = [s.c, s.t, s.tk, s.a, s.ak, s.y, s.r, (s.sp || []).map(p => (p.n || '') + ' ' + (p.o || '')).join(' '),
      (s.sv || []).join(' '), (s.tp || []).join(' '), (s.ai || []).join(' ')].join(' ').toLowerCase();
  }
  for (const list of groups.values()) list.sort((a, b) => timeKey(a) < timeKey(b) ? -1 : 1);

  for (const f of FACETS) {
    const totals = new Map();
    for (const s of S) for (const v of s._f[f.k]) totals.set(v, (totals.get(v) || 0) + 1);
    let vals = [...totals.keys()];
    if (Array.isArray(f.order)) vals = f.order.filter(v => totals.has(v));
    else if (f.order === 'key') vals.sort((a, b) => (a === NONE) - (b === NONE) || (a < b ? -1 : 1));
    else vals.sort((a, b) => totals.get(b) - totals.get(a) || (a < b ? -1 : 1));
    f.values = vals.map(v => ({ v, label: f.fmt ? f.fmt(v) : v }));
  }

  const DAYS = [...new Set(S.map(s => s.d).filter(Boolean))].sort();
  const VENUES = [...new Set(S.map(s => s.v).filter(Boolean))].sort();
  const venueClass = s => 'v' + (VENUES.indexOf(s.v) + 1);

  const state = {
    pick: null,
    view: location.hash === '#my' ? 'my' : 'all',
    q: '',
    sort: 'time',
    sel: Object.fromEntries(FACETS.map(f => [f.k, new Set()])),
    opts: Object.assign({ ko: true, group: true, noSpon: false, noLap: false, myMode: 'grid', info: {} }, store.get('ri26.opts', {})),
    open: new Set(),
    orig: new Set(), // 번역 대신 원문 설명을 보고 있는 세션

    shown: PAGE,
    rows: []
  };
  const fav = new Set(store.get('ri26.fav', []).filter(c => byCode.has(c)));

  /* ---------- 필터 레일 ---------- */
  function buildFacets() {
    $('facets').innerHTML = FACETS.map(f => {
      const long = f.values.length > 12;
      const explain = f.info && state.opts.info[f.k];
      return '<details class="facet' + (explain ? ' explain' : '') + '" data-k="' + f.k + '"' + (f.open ? ' open' : '') + '>' +
        '<summary><span>' + f.label + '</span><span class="facet-n" hidden></span></summary>' +
        (long ? '<input class="facet-q" id="fq-' + f.k + '" data-k="' + f.k + '" type="search" placeholder="' + f.label + ' 찾기" aria-label="' + f.label + ' 찾기">' : '') +
        (f.info ? '<button class="facet-info" id="fi-' + f.k + '" data-info="' + f.k + '" aria-pressed="' + !!explain + '">' + (explain ? '설명 숨기기' : '설명 보기') + '</button>' : '') +
        '<ul class="opts">' +
        f.values.map((o, i) =>
          '<li><label><input type="checkbox" id="f-' + f.k + '-' + i + '" data-k="' + f.k + '" data-i="' + i + '">' +
          '<span class="opt-l">' + esc(o.label) + (f.info && f.info(o.v) ? '<span class="opt-d">' + f.info(o.v) + '</span>' : '') +
          '</span><span class="opt-c"></span></label></li>').join('') +
        '</ul>' + (long ? '<button class="facet-more" id="fm-' + f.k + '" data-more="' + f.k + '" hidden></button>' : '') + '</details>';
    }).join('');
  }

  function updateFacets(counts) {
    for (const f of FACETS) {
      const box = $('facets').querySelector('.facet[data-k="' + f.k + '"]');
      const fq = (box.querySelector('.facet-q') || { value: '' }).value.trim().toLowerCase();
      const items = box.querySelectorAll('li');
      const more = box.querySelector('.facet-more');
      // 목록 안에 따로 스크롤을 두면 휠이 그 안에 갇히므로, 긴 목록은 접어 두고 버튼으로 펼친다
      const fold = more && !f.all && fq === '';
      let shown = 0, folded = 0;
      f.values.forEach((o, i) => {
        const n = counts[f.k].get(o.v) || 0;
        const on = state.sel[f.k].has(o.v);
        const li = items[i];
        li.querySelector('input').checked = on;
        li.querySelector('.opt-c').textContent = n;
        let hide = (n === 0 && !on) || (fq !== '' && !o.label.toLowerCase().includes(fq));
        if (!hide && fold && !on && shown >= FACET_LIMIT) { hide = true; folded++; }
        if (!hide) shown++;
        li.hidden = hide;
      });
      if (more) {
        more.hidden = fq !== '' || (f.all ? shown <= FACET_LIMIT : folded === 0);
        more.textContent = f.all ? '접기' : folded.toLocaleString() + '개 더 보기';
        more.setAttribute('aria-expanded', String(!!f.all));
      }
      const badge = box.querySelector('.facet-n');
      badge.hidden = state.sel[f.k].size === 0;
      badge.textContent = state.sel[f.k].size;
    }
  }

  function updatePicked() {
    const chips = [];
    for (const f of FACETS) {
      f.values.forEach((o, i) => {
        if (state.sel[f.k].has(o.v)) {
          chips.push('<button class="pick" data-k="' + f.k + '" data-i="' + i + '" aria-label="' + esc(f.label + ' ' + o.label) + ' 필터 해제">' + esc(o.label) + '</button>');
        }
      });
    }
    if (chips.length > 1 || (chips.length && state.q)) chips.push('<button class="pick clear" data-clear="1">모두 지우기</button>');
    $('picked').innerHTML = chips.join('');
  }

  /* ---------- 필터 계산 ---------- */
  function compute() {
    const toks = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    const active = FACETS.filter(f => state.sel[f.k].size);
    const counts = Object.fromEntries(FACETS.map(f => [f.k, new Map()]));
    const out = [];
    const bump = (k, s) => { for (const v of s._f[k]) counts[k].set(v, (counts[k].get(v) || 0) + 1); };
    for (const s of S) {
      if (state.opts.noSpon && s.spon) continue;
      if (state.opts.noLap && s.lap) continue;
      if (toks.length && !toks.every(t => s._h.includes(t))) continue;
      let fails = 0, failed = null;
      for (const f of active) {
        const set = state.sel[f.k];
        if (!s._f[f.k].some(v => set.has(v))) { fails++; failed = f; if (fails > 1) break; }
      }
      // 각 필터의 건수는 "그 필터만 빼고" 나머지 조건을 만족하는 세션 수
      if (fails === 0) { out.push(s); for (const f of FACETS) bump(f.k, s); }
      else if (fails === 1) bump(failed.k, s);
    }
    return { out, counts };
  }

  function sortRows(list) {
    const key = state.sort === 'code' ? (s => s.c) : state.sort === 'title' ? (s => titleOf(s).toLowerCase() + ' ' + timeKey(s)) : timeKey;
    return list.map(s => [key(s), s]).sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0).map(p => p[1]);
  }

  /* ---------- 세션 한 줄 ---------- */
  function starBtn(s) {
    const on = fav.has(s.c);
    return '<button class="star" data-star="' + esc(s.c) + '" aria-pressed="' + on + '" aria-label="' + esc(s.c) + (on ? ' 내 일정에서 빼기' : ' 내 일정에 담기') + '">' + STAR + '</button>';
  }
  function whenText(s) {
    return s.d ? dayLabel(s.d) + ' ' + s.s + '–' + s.e : '일정 미정';
  }

  function abstractHTML(s) {
    if (!s.a) return '';
    if (!(state.opts.ko && s.ak)) return '<p>' + esc(s.a) + '</p>';
    const orig = state.orig.has(s.c);
    return '<div class="abs"><p' + (orig ? ' lang="en"' : '') + '>' + esc(orig ? s.a : s.ak) + '</p>' +
      '<button class="abs-swap" data-orig="' + esc(s.c) + '">' + (orig ? '번역 보기' : '원문 보기') + '</button></div>';
  }

  function detailHTML(s) {
    const rows = [];
    const ti = typeInfo(s.y);
    if (ti) rows.push(['유형', esc(s.y) + ' · 보통 ' + esc(ti[1]) + '<span class="note">' + esc(ti[0]) + '. ' + esc(ti[2]) + '.</span>']);
    if (s.sp && s.sp.length) {
      rows.push(['발표자', s.sp.map(p => '<span class="who">' + esc(p.n || '') +
        (p.j || p.o ? ' <span>' + esc([p.j, p.o].filter(Boolean).join(', ')) + '</span>' : '') + '</span>').join('')]);
    }
    if (s.r) rows.push(['장소', esc(s.r.split(' | ').join(' › ')) + (s.cap && s.cap !== '0' ? ' · 정원 ' + esc(s.cap) + '명' : '')]);
    const sibs = groups.get(s.g);
    if (sibs.length > 1) {
      rows.push(['진행 시간', '<ul class="slots">' + sibs.map(x =>
        '<li>' + starBtn(x) + '<span class="when' + (x.c === s.c ? ' here' : '') + '">' + esc(x.c) + ' · ' + esc(whenText(x)) + '</span>' +
        '<span>' + esc(x.v || '') + '</span></li>').join('') + '</ul>']);
    }
    [['tp', '토픽'], ['ai', '관심 분야'], ['sv', '서비스'], ['ro', '대상 직무'], ['in', '산업']].forEach(([k, label]) => {
      if (s[k] && s[k].length) rows.push([label, esc(s[k].join(' · '))]);
    });
    if (s.ft && s.ft.length) {
      rows.push(['진행 방식', s.ft.map(v => '<span class="who">' + esc(v) +
        (FORMAT_INFO[v] ? ' <span>' + esc(FORMAT_INFO[v]) + '</span>' : '') + '</span>').join('')]);
    }
    rows.push(['공식 페이지', '<a href="' + esc(s.u) + '" target="_blank" rel="noopener">카탈로그에서 ' + esc(s.c) + ' 열기</a>']);
    return '<div class="r-detail">' + abstractHTML(s) + '<dl class="dl">' +
      rows.map(r => '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>').join('') + '</dl></div>';
  }

  function rowHTML(s, extra) {
    extra = extra || {};
    const open = state.open.has(s.c);
    const time = s.d
      ? '<span class="t-day">' + dayLabel(s.d) + '</span><span class="t-hm">' + s.s + '–' + s.e + '</span>' +
        (s.len ? '<span class="t-len">' + s.len + '분</span>' : '')
      : '<span class="t-day tbd">일정 미정</span>';
    const chips = ['<span class="code">' + esc(s.c) + '</span>', '<span class="chip"' + (typeInfo(s.y) ? ' title="' + esc(typeInfo(s.y)[0] + ' · ' + typeInfo(s.y)[2]) + '"' : '') + '>' + esc(s.y) + '</span>'];
    if (s.l) chips.push('<span class="lv lv' + s.l[0] + '" title="' + esc(LEVELS[s.l] || s.l) + '">' + esc(s.l) + '</span>');
    if (s.lap) chips.push('<span class="chip">노트북 필요</span>');
    if (s.spon) chips.push('<span class="chip">스폰서</span>');
    if (extra.repeats > 1) chips.push('<span class="chip rep">' + extra.repeats + '회 진행</span>');
    if (extra.clash) chips.push('<span class="chip clash">시간 겹침 · ' + esc(extra.clash.join(', ')) + '</span>');
    const meta = [s.v, (s.sp || []).map(p => p.n).filter(Boolean).join(', ')].filter(Boolean).join(' · ');
    return '<article class="row' + (open ? ' open' : '') + '" data-c="' + esc(s.c) + '">' +
      '<div class="r-time">' + time + '</div>' +
      '<div class="r-main"><div class="r-top">' + chips.join('') + '</div>' +
      '<h3><button class="r-title" data-open="' + esc(s.c) + '" aria-expanded="' + open + '">' +
      (koOn(s) ? esc(s.tk) + '<span class="r-en" lang="en">' + esc(s.t) + '</span>' : esc(s.t)) + '</button></h3>' +
      (meta ? '<div class="r-meta">' + esc(meta) + '</div>' : '') +
      (open ? detailHTML(s) : '') + '</div>' + starBtn(s) + '</article>';
  }

  /* ---------- 전체 세션 보기 ---------- */
  function renderAll() {
    const { out, counts } = compute();
    updateFacets(counts);
    updatePicked();
    let rows = sortRows(out).map(s => ({ s, x: {} }));
    if (state.opts.group) {
      const first = new Map();
      for (const r of rows) {
        if (first.has(r.s.g)) first.get(r.s.g).x.repeats++;
        else { r.x.repeats = 1; first.set(r.s.g, r); }
      }
      rows = [...first.values()];
    }
    state.rows = rows;
    $('count').innerHTML = state.opts.group
      ? '<b>' + rows.length.toLocaleString() + '</b>개 세션 <span>(반복 포함 ' + out.length.toLocaleString() + '회)</span>'
      : '<b>' + out.length.toLocaleString() + '</b>개 세션';
    paintRows();
  }

  function paintRows() {
    const rows = state.rows;
    if (!rows.length) {
      $('out').innerHTML = '<div class="empty"><b>조건에 맞는 세션이 없습니다</b>검색어를 줄이거나 필터를 몇 개 해제해 보세요.</div>';
      $('more').hidden = true;
      return;
    }
    $('out').innerHTML = '<div class="list">' + rows.slice(0, state.shown).map(r => rowHTML(r.s, r.x)).join('') + '</div>';
    const left = rows.length - state.shown;
    $('more').hidden = left <= 0;
    $('more').textContent = '더 보기 (' + Math.max(left, 0).toLocaleString() + '개 남음)';
  }

  /* ---------- 내 일정 보기 ---------- */
  function mySchedule() {
    const list = [...fav].map(c => byCode.get(c)).filter(Boolean).sort((a, b) => timeKey(a) < timeKey(b) ? -1 : 1);
    const days = new Map();
    for (const s of list) {
      const k = s.d || '';
      if (!days.has(k)) days.set(k, []);
      days.get(k).push(s);
    }
    return { list, days };
  }

  function clashesOf(items) {
    const clash = new Map();
    for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
      const a = items[i], b = items[j];
      if (a.sm < b.em && b.sm < a.em) {
        if (!clash.has(a.c)) clash.set(a.c, []);
        if (!clash.has(b.c)) clash.set(b.c, []);
        clash.get(a.c).push(b.c); clash.get(b.c).push(a.c);
      }
    }
    return clash;
  }

  // 시간표 블록의 끝 시각. 길이가 0분으로 온 세션도 보이도록 최소 20분을 준다
  const blockEnd = s => Math.max(s.em, s.sm + 20);

  // 겹치는 세션끼리 한 묶음으로 보고, 묶음 안에서 옆으로 나란히 놓을 칸을 정한다
  function lanesOf(items) {
    const out = new Map();
    let cluster = [], ends = [], clusterEnd = -1;
    const flush = () => {
      for (const c of cluster) out.set(c.s.c, { lane: c.lane, n: ends.length });
      cluster = []; ends = []; clusterEnd = -1;
    };
    for (const s of items) {
      if (cluster.length && s.sm >= clusterEnd) flush();
      let lane = ends.findIndex(e => e <= s.sm);
      if (lane < 0) { lane = ends.length; ends.push(0); }
      ends[lane] = blockEnd(s);
      cluster.push({ s, lane });
      clusterEnd = Math.max(clusterEnd, blockEnd(s));
    }
    flush();
    return out;
  }

  function listHTML(days, clashByDay) {
    const html = [];
    for (const [d, items] of days) {
      const clash = clashByDay.get(d);
      html.push('<section class="day"><div class="day-h"><h2>' + dayLabel(d) + '</h2><span>' + items.length + '개 세션</span></div><div class="list">');
      items.forEach((s, i) => {
        html.push(rowHTML(s, { clash: clash.get(s.c) }));
        const n = items[i + 1];
        if (d && n && n.sm >= s.em && s.v && n.v && s.v !== n.v) {
          const gap = n.sm - s.em;
          html.push('<div class="hop' + (gap < TIGHT_GAP_MIN ? ' tight' : '') + '">건물 이동 · ' + esc(s.v) + ' → ' + esc(n.v) + ' · 여유 ' + gap + '분</div>');
        }
      });
      html.push('</div></section>');
    }
    return html.join('');
  }

  function gridHTML(days, clashByDay) {
    const timed = [];
    for (const [d, items] of days) if (d) timed.push(...items);
    const html = ['<div class="my">'];
    if (timed.length) {
      const h0 = Math.min(8, Math.floor(Math.min(...timed.map(s => s.sm)) / 60));
      const h1 = Math.max(18, Math.ceil(Math.max(...timed.map(blockEnd)) / 60));
      const px = m => (m - h0 * 60) * HOUR_PX / 60;
      const height = (h1 - h0) * HOUR_PX;
      html.push('<div class="tt-scroll"><div class="tt" style="--days:' + DAYS.length + ';--hour:' + HOUR_PX + 'px">');
      html.push('<div class="tt-head"><div></div>' + DAYS.map(d =>
        '<div class="tt-dh">' + dayLabel(d) + '<span>' + ((days.get(d) || []).length || '') + '</span></div>').join('') + '</div>');
      html.push('<div class="tt-body"><div class="tt-axis" style="height:' + height + 'px">');
      for (let h = h0; h < h1; h++) html.push('<span style="top:' + px(h * 60) + 'px">' + String(h).padStart(2, '0') + ':00</span>');
      html.push('</div>');
      for (const d of DAYS) {
        const items = days.get(d) || [];
        const lanes = lanesOf(items);
        const clash = clashByDay.get(d) || new Map();
        html.push('<div class="tt-col" style="height:' + height + 'px">');
        for (const s of items) {
          const L = lanes.get(s.c);
          const len = blockEnd(s) - s.sm;
          const cls = ['tt-ev', venueClass(s)];
          if (len < SHORT_MIN) cls.push('short');
          if (clash.has(s.c)) cls.push('clash');
          if (state.pick === s.c) cls.push('on');
          const room = s.r ? s.r.split(' | ').slice(1).pop() || s.v : '';
          html.push('<button class="' + cls.join(' ') + '" data-pick="' + esc(s.c) + '" style="top:' + px(s.sm) + 'px;height:' + (len * HOUR_PX / 60) +
            'px;left:' + (L.lane / L.n * 100) + '%;width:' + (100 / L.n) + '%" aria-label="' + esc(s.c + ' ' + whenText(s) + ' ' + titleOf(s)) + '">' +
            '<span class="tt-code">' + esc(s.c) + '</span><span class="tt-time">' + s.s + '–' + s.e + '</span>' +
            '<span class="tt-title">' + esc(titleOf(s)) + '</span><span class="tt-room">' + esc(room) + '</span></button>');
        }
        html.push('</div>');
      }
      html.push('</div></div></div>');
      const used = VENUES.filter(v => timed.some(s => s.v === v));
      html.push('<ul class="tt-legend">' + used.map(v => '<li><i class="v' + (VENUES.indexOf(v) + 1) + '"></i>' + esc(v) + '</li>').join('') + '</ul>');
      const picked = state.pick && fav.has(state.pick) ? byCode.get(state.pick) : null;
      if (picked) {
        const clash = clashByDay.get(picked.d || '') || new Map();
        html.push('<div class="list" id="tt-pick">' + rowHTML(picked, { clash: clash.get(picked.c) }) + '</div>');
      } else {
        html.push('<p class="tt-hint">블록을 누르면 세션 설명과 발표자가 아래에 표시됩니다.</p>');
      }
    }
    const tbd = days.get('');
    if (tbd) {
      html.push('<section class="day"><div class="day-h"><h2>일정 미정</h2><span>' + tbd.length + '개 세션</span></div><div class="list">' +
        tbd.map(s => rowHTML(s)).join('') + '</div></section>');
    }
    html.push('</div>');
    return html.join('');
  }

  function renderMy() {
    const { list, days } = mySchedule();
    const grid = state.opts.myMode !== 'list';
    $('btn-copy').hidden = list.length === 0;
    $('seg').hidden = list.length === 0;
    $('mode-grid').setAttribute('aria-pressed', String(grid));
    $('mode-list').setAttribute('aria-pressed', String(!grid));
    if (!list.length) {
      $('count').textContent = '';
      $('out').innerHTML = '<div class="empty"><b>아직 담은 세션이 없습니다</b>전체 세션에서 별표를 누르면 요일별 시간표로 정리됩니다.</div>';
      return;
    }
    const clashByDay = new Map();
    let clashes = 0;
    for (const [d, items] of days) {
      const c = d ? clashesOf(items) : new Map();
      clashByDay.set(d, c);
      clashes += c.size;
    }
    $('count').innerHTML = '<b>' + list.length + '</b>개 세션' + (clashes ? ' · 시간이 겹치는 세션 ' + clashes + '개' : '');
    $('out').innerHTML = grid ? gridHTML(days, clashByDay) : listHTML(days, clashByDay);
  }

  function scheduleText() {
    return mySchedule().list.map(s => [whenText(s), s.c, titleOf(s), s.r ? '@ ' + s.r : ''].filter(Boolean).join('  ')).join('\n');
  }

  /* ---------- 내보내기 ---------- */
  // 화면에 추려진 목록을 그대로 파일로 만든다. "더 보기"로 아직 펼치지 않은 줄도 포함한다.
  const joined = k => s => (s[k] || []).join('; ');
  const num = v => { const n = Number(v); return v !== '' && v != null && Number.isFinite(n) ? n : (v || ''); };
  const slotsOf = s => groups.get(s.g).length > 1 ? groups.get(s.g) : [];
  // [머리글, 값, 엑셀 열 너비]
  const EXPORT_COLS = [
    ['코드', s => s.c, 14],
    ['제목', s => s.t, 60],
    ['제목(번역)', s => s.tk || '', 60],
    ['유형', s => s.y, 18],
    ['레벨', s => num(s.l), 8],
    ['날짜', s => s.d, 12],
    ['요일', s => s.d ? dayLabel(s.d).split(' ')[0] : '', 6],
    ['시작', s => s.s, 8],
    ['종료', s => s.e, 8],
    ['길이(분)', s => num(s.len), 9],
    ['건물', s => s.v, 18],
    ['장소', s => s.r, 40],
    ['정원', s => s.cap === '0' ? '' : num(s.cap), 8],
    ['발표자', s => (s.sp || []).map(p => (p.n || '') + (p.j || p.o ? ' (' + [p.j, p.o].filter(Boolean).join(', ') + ')' : '')).join('; '), 50],
    ['토픽', joined('tp'), 30],
    ['관심 분야', joined('ai'), 30],
    ['AWS 서비스', joined('sv'), 30],
    ['대상 직무', joined('ro'), 30],
    ['산업', joined('in'), 30],
    ['진행 방식', joined('ft'), 24],
    ['노트북 필요', s => s.lap ? 'Y' : '', 11],
    ['스폰서', s => s.spon ? 'Y' : '', 8],
    ['전체 진행 시간', s => slotsOf(s).map(x => x.c + ' ' + whenText(x) + (x.v ? ' @ ' + x.v : '')).join('; '), 50],
    ['설명', s => s.a, 80],
    ['설명(번역)', s => s.ak || '', 80],
    ['공식 페이지', s => s.u, 50]
  ];

  function exportRows() {
    return state.view === 'my' ? mySchedule().list : state.rows.map(r => r.s);
  }
  function exportTable(list) {
    return [EXPORT_COLS.map(c => c[0])].concat(list.map(s => EXPORT_COLS.map(c => { const v = c[1](s); return v == null ? '' : v; })));
  }

  function toCSV(list) {
    const cell = v => { const t = String(v); return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
    // 맨 앞의 BOM 은 엑셀이 한글을 UTF-8 로 읽게 한다
    return '﻿' + exportTable(list).map(r => r.map(cell).join(',')).join('\r\n') + '\r\n';
  }

  function toJSON(list) {
    const filters = {};
    if (state.view !== 'my') for (const f of FACETS) if (state.sel[f.k].size) filters[f.label] = f.values.filter(o => state.sel[f.k].has(o.v)).map(o => o.label);
    const slot = x => ({ code: x.c, date: x.d || null, start: x.s || null, end: x.e || null, venue: x.v || null });
    return JSON.stringify({
      event: DATA.meta.event,
      dataAsOf: DATA.meta.modified || null,
      exportedAt: new Date().toISOString(),
      view: state.view === 'my' ? 'my-schedule' : 'sessions',
      query: state.view === 'my' ? '' : state.q,
      filters,
      count: list.length,
      sessions: list.map(s => ({
        code: s.c, group: s.g, title: s.t, titleKo: s.tk || null, type: s.y, level: s.l || null, track: s.tr || null,
        date: s.d || null, start: s.s || null, end: s.e || null, minutes: s.len || null,
        venue: s.v || null, room: s.r || null, capacity: s.cap && s.cap !== '0' ? num(s.cap) : null,
        speakers: (s.sp || []).map(p => ({ name: p.n || '', title: p.j || '', company: p.o || '' })),
        topics: s.tp || [], areasOfInterest: s.ai || [], services: s.sv || [],
        roles: s.ro || [], industries: s.in || [], features: s.ft || [],
        laptopRequired: !!s.lap, sponsored: !!s.spon,
        slots: slotsOf(s).map(slot),
        abstract: s.a || '', abstractKo: s.ak || null, url: s.u
      }))
    }, null, 2);
  }

  // 압축하지 않는 zip. xlsx 는 XML 몇 개를 zip 으로 묶은 것이라 이것으로 충분하다
  const CRC = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();
  function crc32(b) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function zip(files) {
    const enc = new TextEncoder();
    const now = new Date();
    const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    const parts = [], central = [];
    let offset = 0;
    for (const [name, text] of files) {
      const nm = enc.encode(name), body = enc.encode(text), crc = crc32(body);
      const head = (sig, extra) => {
        const b = new Uint8Array(extra), v = new DataView(b.buffer);
        let p = 0;
        v.setUint32(p, sig, true); p += 4;
        if (extra === 46) { v.setUint16(p, 20, true); p += 2; }
        v.setUint16(p, 20, true); v.setUint16(p + 2, 0x0800, true); v.setUint16(p + 4, 0, true);
        v.setUint16(p + 6, time, true); v.setUint16(p + 8, date, true);
        v.setUint32(p + 10, crc, true); v.setUint32(p + 14, body.length, true); v.setUint32(p + 18, body.length, true);
        v.setUint16(p + 22, nm.length, true);
        if (extra === 46) v.setUint32(42, offset, true);
        return b;
      };
      parts.push(head(0x04034b50, 30), nm, body);
      central.push(head(0x02014b50, 46), nm);
      offset += 30 + nm.length + body.length;
    }
    const size = central.reduce((n, b) => n + b.length, 0);
    const end = new Uint8Array(22), v = new DataView(end.buffer);
    v.setUint32(0, 0x06054b50, true);
    v.setUint16(8, files.length, true); v.setUint16(10, files.length, true);
    v.setUint32(12, size, true); v.setUint32(16, offset, true);
    return new Blob([...parts, ...central, end]);
  }

  function toXLSX(list) {
    const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
    const REL = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
    const PKG = 'http://schemas.openxmlformats.org/package/2006';
    const XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
    // XML 에 넣을 수 없는 제어 문자는 빼고, 엑셀의 셀 길이 한도에 맞춘다
    const x = v => String(v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g, '').slice(0, 32767)
      .replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    const col = i => { let n = ''; for (i++; i > 0; i = Math.floor((i - 1) / 26)) n = String.fromCharCode(65 + (i - 1) % 26) + n; return n; };
    const table = exportTable(list);
    const rows = table.map((r, ri) => '<row r="' + (ri + 1) + '">' + r.map((v, ci) => {
      if (v === '') return '';
      const ref = ' r="' + col(ci) + (ri + 1) + '"' + (ri === 0 ? ' s="1"' : '');
      return typeof v === 'number' ? '<c' + ref + '><v>' + v + '</v></c>'
        : '<c' + ref + ' t="inlineStr"><is><t xml:space="preserve">' + x(v) + '</t></is></c>';
    }).join('') + '</row>').join('');
    const sheet = XML + '<worksheet xmlns="' + NS + '">' +
      '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' +
      '<cols>' + EXPORT_COLS.map((c, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + c[2] + '" customWidth="1"/>').join('') + '</cols>' +
      '<sheetData>' + rows + '</sheetData>' +
      '<autoFilter ref="A1:' + col(EXPORT_COLS.length - 1) + table.length + '"/></worksheet>';
    return zip([
      ['[Content_Types].xml', XML + '<Types xmlns="' + PKG + '/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
        '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
        '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],
      ['_rels/.rels', XML + '<Relationships xmlns="' + PKG + '/relationships">' +
        '<Relationship Id="rId1" Type="' + REL + '/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
      ['xl/workbook.xml', XML + '<workbook xmlns="' + NS + '" xmlns:r="' + REL + '">' +
        '<sheets><sheet name="Sessions" sheetId="1" r:id="rId1"/></sheets></workbook>'],
      ['xl/_rels/workbook.xml.rels', XML + '<Relationships xmlns="' + PKG + '/relationships">' +
        '<Relationship Id="rId1" Type="' + REL + '/worksheet" Target="worksheets/sheet1.xml"/>' +
        '<Relationship Id="rId2" Type="' + REL + '/styles" Target="styles.xml"/></Relationships>'],
      ['xl/styles.xml', XML + '<styleSheet xmlns="' + NS + '">' +
        '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>' +
        '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>' +
        '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
        '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
        '<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
        '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs></styleSheet>'],
      ['xl/worksheets/sheet1.xml', sheet]
    ]);
  }

  const EXPORTS = {
    csv: { make: toCSV, mime: 'text/csv;charset=utf-8' },
    xlsx: { make: toXLSX, mime: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' },
    json: { make: toJSON, mime: 'application/json' }
  };

  // Artifact 안에서는 뷰어가 저장을 확인받고 내려준다. 로컬 파일에서는 브라우저가 바로 받는다
  async function saveFile(filename, data, mime) {
    let dl = null;
    if (window.claude && typeof window.claude.use === 'function') {
      try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    }
    if (dl) { await dl.save({ filename, data }); return; }
    const url = URL.createObjectURL(new Blob([data], { type: mime }));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  let noteTimer = 0;
  function exportNote(text, bad) {
    const el = $('export-note');
    el.textContent = text;
    el.classList.toggle('bad', !!bad);
    el.hidden = !text;
    clearTimeout(noteTimer);
    if (text) noteTimer = setTimeout(() => { el.hidden = true; }, 4000);
  }

  async function exportAs(kind) {
    const list = exportRows();
    if (!list.length || !EXPORTS[kind]) return;
    const p = n => String(n).padStart(2, '0');
    const now = new Date();
    const stamp = now.getFullYear() + p(now.getMonth() + 1) + p(now.getDate()) + '-' + p(now.getHours()) + p(now.getMinutes());
    const name = 'reinvent2026-' + (state.view === 'my' ? 'my-schedule' : 'sessions') + '-' + stamp + '.' + kind;
    try {
      await saveFile(name, EXPORTS[kind].make(list), EXPORTS[kind].mime);
      exportNote(list.length.toLocaleString() + '개 세션을 ' + name + ' 로 내보냈습니다.');
    } catch (e) {
      if (e && e.code === 'declined') exportNote('');
      else if (e && e.code === 'rate_limited') exportNote('저장 창이 이미 열려 있습니다. 잠시 후 다시 시도하세요.', true);
      else exportNote('파일을 저장하지 못했습니다.', true);
    }
  }

  function updateExport() {
    const n = exportRows().length;
    $('export').hidden = n === 0;
    if (n === 0) $('export').open = false;
    $('export-h').textContent = (state.view === 'my' ? '내 일정 ' : '추려진 ') + n.toLocaleString() + '개 세션';
  }

  /* ---------- 공통 ---------- */
  function render() {
    const my = state.view === 'my';
    $('tab-all').setAttribute('aria-selected', String(!my));
    $('tab-my').setAttribute('aria-selected', String(my));
    $('my-n').textContent = fav.size;
    $('cols').style.gridTemplateColumns = my ? 'minmax(0, 1fr)' : '';
    $('rail').hidden = my;
    $('picked').hidden = my;
    $('q').parentElement.hidden = my;
    $('sort').hidden = my;
    $('btn-filter').hidden = my;
    if (!my) $('seg').hidden = true;
    $('copybox').hidden = true;
    if (my) { $('more').hidden = true; renderMy(); }
    else { $('btn-copy').hidden = true; renderAll(); }
    updateExport();
    queueFitRail();
  }
  function refilter() { state.shown = PAGE; render(); }

  /* ---------- 기기 간 동기화 ---------- */
  // Artifact 로 열었을 때만 동작한다. 즐겨찾기를 계정별 비공개 저장소에 두어
  // 같은 계정으로 연 다른 기기와 맞춘다. 로컬 파일에서는 브라우저 저장만 쓴다.
  const SYNC_NOTE = {
    on: '즐겨찾기는 계정에 저장되어 다른 기기에서도 보입니다.',
    fail: '즐겨찾기를 계정에 저장하지 못했습니다. 지금은 이 브라우저에만 저장됩니다.'
  };
  const sync = { doc: null, writing: false, dirty: false };
  const setSyncNote = kind => { $('sync-note').textContent = SYNC_NOTE[kind]; };

  function adopt(codes) {
    const next = codes.filter(c => byCode.has(c));
    if (next.length === fav.size && next.every(c => fav.has(c))) return;
    fav.clear();
    next.forEach(c => fav.add(c));
    store.set('ri26.fav', [...fav]);
    render();
  }

  // 한 번에 하나씩만 쓴다. 쓰는 도중 바뀐 내용은 끝난 뒤 한 번 더 쓴다
  async function push() {
    if (!sync.doc) return;
    sync.dirty = true;
    if (sync.writing) return;
    sync.writing = true;
    try {
      while (sync.dirty) {
        sync.dirty = false;
        await sync.doc.set({ codes: [...fav], updatedAt: new Date().toISOString() });
      }
      setSyncNote('on');
    } catch (e) {
      sync.dirty = false;
      setSyncNote('fail');
    } finally {
      sync.writing = false;
    }
  }

  async function startSync() {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    try {
      const [user, db] = await Promise.all([window.claude.use('user'), window.claude.use('db')]);
      if (!user || !db) return;
      const uid = await user.id();
      if (!uid) return;
      const doc = db.doc('data/users/' + uid + '/favorites');
      const snap = await doc.get();
      const saved = snap.exists ? (snap.data() || {}).codes : null;
      const remote = Array.isArray(saved) ? saved : [];
      sync.doc = doc;
      if (!store.get('ri26.synced', false) && fav.size) {
        // 이 기기에서 처음 연결: 여기서 담아둔 것과 계정에 있던 것을 합친다
        const before = fav.size;
        const local = [...fav];
        adopt([...new Set([...remote, ...local])]);
        if (fav.size !== remote.length || before !== fav.size) push();
      } else if (snap.exists) {
        adopt(remote);
      } else if (fav.size) {
        push();
      }
      store.set('ri26.synced', true);
      setSyncNote('on');
      doc.onSnapshot(s => {
        if (sync.writing || sync.dirty || s.metadata.hasPendingWrites || !s.exists) return;
        const codes = (s.data() || {}).codes;
        if (Array.isArray(codes)) adopt(codes);
      }, () => setSyncNote('fail'));
    } catch (e) {
      setSyncNote('fail');
    }
  }

  function toggleFav(code) {
    if (fav.has(code)) fav.delete(code); else fav.add(code);
    store.set('ri26.fav', [...fav]);
    push();
    $('my-n').textContent = fav.size;
    if (state.view === 'my') { renderMy(); updateExport(); return; }
    const on = fav.has(code);
    document.querySelectorAll('[data-star]').forEach(b => {
      if (b.getAttribute('data-star') !== code) return;
      b.setAttribute('aria-pressed', String(on));
      b.setAttribute('aria-label', code + (on ? ' 내 일정에서 빼기' : ' 내 일정에 담기'));
    });
  }

  // 세션 한 줄만 다시 그리고, 누른 버튼으로 포커스를 되돌린다
  function repaintRow(code, attr) {
    if (state.view === 'my') { renderMy(); return; }
    const el = $('out').querySelector('.row[data-c="' + CSS.escape(code) + '"]');
    const r = state.rows.find(x => x.s.c === code);
    if (el && r) el.outerHTML = rowHTML(r.s, r.x);
    const btn = $('out').querySelector('[' + attr + '="' + CSS.escape(code) + '"]');
    if (btn) btn.focus();
  }

  function toggleOpen(code) {
    if (state.open.has(code)) state.open.delete(code); else state.open.add(code);
    repaintRow(code, 'data-open');
  }

  function toggleOrig(code) {
    if (state.orig.has(code)) state.orig.delete(code); else state.orig.add(code);
    repaintRow(code, 'data-orig');
  }

  function setView(v) {
    state.view = v;
    try { history.replaceState(null, '', v === 'my' ? '#my' : location.pathname + location.search); } catch (e) { /* 무시 */ }
    render();
    window.scrollTo(0, 0);
  }

  /* ---------- 이벤트 ---------- */
  document.addEventListener('click', e => {
    if (!e.target.closest('#export summary')) $('export').open = false;
    const t = e.target.closest('[data-star],[data-open],[data-orig],[data-view],[data-pick],[data-mode],[data-export],[data-more],[data-info],.pick');
    if (!t) return;
    if (t.hasAttribute('data-info')) {
      const k = t.getAttribute('data-info');
      const on = !state.opts.info[k];
      state.opts.info = Object.assign({}, state.opts.info, { [k]: on });
      store.set('ri26.opts', state.opts);
      t.closest('.facet').classList.toggle('explain', on);
      t.setAttribute('aria-pressed', String(on));
      t.textContent = on ? '설명 숨기기' : '설명 보기';
      return;
    }
    if (t.hasAttribute('data-more')) {
      const f = FACETS.find(x => x.k === t.getAttribute('data-more'));
      f.all = !f.all;
      updateFacets(compute().counts);
      return;
    }
    if (t.hasAttribute('data-export')) { exportAs(t.getAttribute('data-export')); return; }
    if (t.hasAttribute('data-pick')) {
      const code = t.getAttribute('data-pick');
      state.pick = code;
      state.open.add(code);
      renderMy();
      const panel = $('tt-pick');
      if (panel) panel.scrollIntoView({ block: 'nearest' });
      return;
    }
    if (t.hasAttribute('data-mode')) {
      state.opts.myMode = t.getAttribute('data-mode');
      store.set('ri26.opts', state.opts);
      renderMy();
      return;
    }
    if (t.hasAttribute('data-star')) toggleFav(t.getAttribute('data-star'));
    else if (t.hasAttribute('data-open')) toggleOpen(t.getAttribute('data-open'));
    else if (t.hasAttribute('data-orig')) toggleOrig(t.getAttribute('data-orig'));
    else if (t.hasAttribute('data-view')) setView(t.getAttribute('data-view'));
    else if (t.hasAttribute('data-clear')) {
      for (const f of FACETS) state.sel[f.k].clear();
      state.q = ''; $('q').value = '';
      refilter();
    } else {
      const f = FACETS.find(x => x.k === t.getAttribute('data-k'));
      state.sel[f.k].delete(f.values[+t.getAttribute('data-i')].v);
      refilter();
    }
  });

  $('facets').addEventListener('change', e => {
    const el = e.target;
    if (!el.matches('input[type="checkbox"]')) return;
    const f = FACETS.find(x => x.k === el.getAttribute('data-k'));
    const v = f.values[+el.getAttribute('data-i')].v;
    if (el.checked) state.sel[f.k].add(v); else state.sel[f.k].delete(v);
    refilter();
  });
  $('facets').addEventListener('input', e => {
    if (e.target.matches('.facet-q')) updateFacets(compute().counts);
  });

  let timer = 0;
  $('q').addEventListener('input', e => {
    clearTimeout(timer);
    timer = setTimeout(() => { state.q = e.target.value.trim(); refilter(); }, 120);
  });
  $('sort').addEventListener('change', e => { state.sort = e.target.value; refilter(); });

  [['opt-ko', 'ko'], ['opt-group', 'group'], ['opt-nospon', 'noSpon'], ['opt-nolap', 'noLap']].forEach(([id, k]) => {
    $(id).checked = !!state.opts[k];
    $(id).addEventListener('change', e => {
      state.opts[k] = e.target.checked;
      store.set('ri26.opts', state.opts);
      refilter();
    });
  });

  $('btn-filter').addEventListener('click', () => {
    const on = $('rail').classList.toggle('show');
    $('btn-filter').setAttribute('aria-expanded', String(on));
  });

  $('more').addEventListener('click', () => { state.shown += PAGE; paintRows(); });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(entries => {
      if (entries.some(en => en.isIntersecting) && !$('more').hidden) { state.shown += PAGE; paintRows(); }
    }, { rootMargin: '600px' }).observe($('more'));
  }

  $('btn-copy').addEventListener('click', () => {
    const text = scheduleText();
    const done = () => { $('btn-copy').textContent = '복사됨'; setTimeout(() => { $('btn-copy').textContent = '일정 복사'; }, 1500); };
    const fallback = () => { const b = $('copybox'); b.value = text; b.hidden = false; b.focus(); b.select(); };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (err) { fallback(); }
  });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape' || !$('export').open) return;
    $('export').open = false;
    $('export').querySelector('summary').focus();
  });

  // 필터 레일은 화면 아래 끝까지만 차지하게 한다. 맨 위에서는 머리말만큼 덜 쓸 수 있다
  let railFrame = 0;
  function fitRail() {
    railFrame = 0;
    const rail = $('rail');
    if (rail.hidden || getComputedStyle(rail).position !== 'sticky') { rail.style.removeProperty('--rail-h'); return; }
    const room = window.innerHeight - rail.getBoundingClientRect().top - 16;
    rail.style.setProperty('--rail-h', Math.max(room, 160) + 'px');
  }
  const queueFitRail = () => { if (!railFrame) railFrame = requestAnimationFrame(fitRail); };
  window.addEventListener('scroll', queueFitRail, { passive: true });
  window.addEventListener('resize', queueFitRail);

  window.addEventListener('hashchange', () => {
    const v = location.hash === '#my' ? 'my' : 'all';
    if (v !== state.view) { state.view = v; render(); }
  });

  /* ---------- 시작 ---------- */
  const m = DATA.meta;
  $('meta-line').textContent = '11월 30일(월) ~ 12월 4일(금), 라스베이거스';
  $('meta-date').textContent = '데이터 기준 ' + (m.modified || '').slice(0, 10);
  $('opt-ko-wrap').hidden = $('ko-note').hidden = !m.ko;
  buildFacets();
  render();
  fitRail();
  startSync();
})();
</script>
